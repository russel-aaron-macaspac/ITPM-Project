<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FolioForge | Project Showcase</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.11.1/tsparticles.bundle.min.js"></script>

  <link rel="icon" type="image/png" href="logoo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css">
</head>
<body class="relative bg-neutral-950 text-neutral-100 min-h-screen px-4 flex items-center justify-center">

  <!-- Simple FF Logo Top-Left in Dark Gray -->
  <a href="index.html" class="absolute top-4 left-4 z-20 text-gray-400 font-extrabold text-xl sm:text-2xl tracking-tight hover:text-blue-500 transition duration-300" style="font-family: 'Libre Baskerville', serif;">
    <span class="text-gray-400">F</span><span class="text-blue-900">F</span>
  </a>

  <!-- Background Particles -->
  <div id="tsparticles"></div>

  <div class="text-center max-w-7xl w-full mx-auto z-10 px-4 sm:px-6 lg:px-8">
    <h1 class="text-3xl sm:text-4xl md:text-5xl text-white mb-4 fade-in">
      Elevate Your Online Presence
    </h1>
    <p class="text-neutral-400 text-base sm:text-lg mb-12 fade-in" style="animation-delay: 0.3s;">
      Meet Our Talented IT Professionals <br> <span class="text-white font-medium">Explore sample projects and get inspired to build your own.</span>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-2 lg:grid-cols-4 gap-8 sm:gap-10 justify-items-center fade-in" style="animation-delay: 0.5s;">
      <!-- Leonardo -->
      <a href="https://onad05.github.io/portfolio" target="_blank" rel="noopener noreferrer" class="glass p-5 flex flex-col items-center text-center w-full max-w-md">
        <img src="images/nardo_pic.jpeg" alt="Leonardo Dominguez" class="w-36 h-36 sm:w-44 sm:h-44 rounded-full elegant-ring shadow-md transition-transform duration-500"/>
        <p class="mt-4 text-white text-base sm:text-lg font-semibold hover:text-blue-400 transition-colors duration-300 whitespace-nowrap">Leonardo D. Dominguez</p>
      </a>

      <!-- David -->
      <a href="https://david-simon-fauni.github.io/portfolio" target="_blank" rel="noopener noreferrer" class="glass p-5 flex flex-col items-center text-center w-full max-w-md">
        <img src="images/fauni_pic.jpg" alt="David Simon Fauni" class="w-36 h-36 sm:w-44 sm:h-44 rounded-full elegant-ring shadow-md transition-transform duration-500"/>
        <p class="mt-4 text-white text-base sm:text-lg font-semibold hover:text-blue-400 transition-colors duration-300 whitespace-nowrap">David Simon C. Fauni</p>
      </a>

      <!-- Russel -->
      <a href="https://russel-aaron-macaspac.github.io/portfolio" target="_blank" rel="noopener noreferrer" class="glass p-5 flex flex-col items-center text-center w-full max-w-md">
        <img src="images/Profilephoto.jpg" alt="Russel Macaspac" class="w-36 h-36 sm:w-44 sm:h-44 rounded-full elegant-ring shadow-md transition-transform duration-500"/>
        <p class="mt-4 text-white text-base sm:text-lg font-semibold hover:text-blue-400 transition-colors duration-300 whitespace-nowrap">Russel Aaron M. Macaspac</p>
      </a>

      <!-- Lee -->
      <a href="https://lee-joshua-reyes.github.io/portfolio" target="_blank" rel="noopener noreferrer" class="glass p-5 flex flex-col items-center text-center w-full max-w-md">
        <img src="images/lee_pic.jpg" alt="Lee Joshua Reyes" class="w-36 h-36 sm:w-44 sm:h-44 rounded-full elegant-ring shadow-md transition-transform duration-500"/>
        <p class="mt-4 text-white text-base sm:text-lg font-semibold hover:text-blue-400 transition-colors duration-300 whitespace-nowrap">Lee Joshua C. Reyes</p>
      </a>
    </div>

    <!-- Inquiries Button -->
    <div class="mt-12 fade-in" style="animation-delay: 0.7s;">
      <a href="inquiries.html" class="inline-block px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition duration-300 glow-button">
        Let’s Build Your Portfolio Today

    </div>

  <script src="home.js"></script>
