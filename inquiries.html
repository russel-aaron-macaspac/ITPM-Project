<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inquiries | ITPM Portfolio</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.11.1/tsparticles.bundle.min.js"></script>
</head>
<body class="relative bg-neutral-950 text-white min-h-screen flex items-center justify-center px-4 py-16">
<div id="tsparticles"></div>
  <!-- Container -->
  <div class="bg-neutral-900 p-8 sm:p-12 rounded-2xl shadow-2xl w-full max-w-xl fade-in">
    <h2 class="text-3xl sm:text-4xl font-bold mb-6 text-center text-white">Let's Work Together</h2>
    <p class="text-neutral-400 text-center mb-8">Interested in having your own portfolio site? Fill out the form below and we'll get back to you!</p>

    <form action="https://formspree.io/f/{your-id}" method="POST" class="space-y-6">
      <input type="text" name="name" placeholder="Your Name" required class="w-full px-4 py-3 rounded-lg bg-neutral-800 text-white placeholder-neutral-400 focus:outline-none">
      <input type="email" name="email" placeholder="Your Email" required class="w-full px-4 py-3 rounded-lg bg-neutral-800 text-white placeholder-neutral-400 focus:outline-none">
      <textarea name="message" rows="5" placeholder="Tell us about your project..." required class="w-full px-4 py-3 rounded-lg bg-neutral-800 text-white placeholder-neutral-400 focus:outline-none"></textarea>
      <button type="submit" class="w-full py-3 rounded-lg bg-blue-600 hover:bg-blue-700 transition font-semibold">Send Inquiry</button>
    </form>

    <div class="text-center mt-6">
      <a href="index.html" class="text-blue-400 hover:underline text-sm">← Back to Home</a>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
