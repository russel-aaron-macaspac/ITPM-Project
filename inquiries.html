<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FolioForge | Inquiries</title>

  <!-- Tailwind & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="inquiries.css">
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.11.1/tsparticles.bundle.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    #tsparticles {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: 0;
      top: 0;
      left: 0;
    }

    .fade-in {
      animation: fadeIn 1.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="relative bg-neutral-950 text-white min-h-screen flex items-center justify-center px-4 py-16">

  <!-- Simple FF Logo Top-Left -->
  <a href="index.html" class="absolute top-4 left-4 z-20 text-gray-400 font-extrabold text-xl sm:text-2xl tracking-tight hover:text-blue-500 transition duration-300" style="font-family: 'Libre Baskerville', serif;">
    <span class="text-gray-400">F</span><span class="text-blue-900">F</span>
  </a>

  <!-- Particle Background -->
  <div id="tsparticles"></div>

  <!-- Form Container -->
  <div class="bg-neutral-900 p-8 sm:p-12 rounded-2xl shadow-2xl w-full max-w-xl z-10 fade-in">
    <h2 class="text-3xl sm:text-4xl font-bold mb-6 text-center text-white">Let's Work Together</h2>
    <p class="text-neutral-400 text-center mb-8">Interested in having your own portfolio site? Fill out the form below and we'll get back to you!</p>

    <form action="https://formspree.io/f/xovdbvlb" method="POST" class="space-y-6">
      <input type="text" name="name" placeholder="Your Name" required class="w-full px-4 py-3 rounded-lg bg-neutral-800 text-white placeholder-neutral-400 focus:outline-none">
      <input type="email" name="email" placeholder="Your Email" required class="w-full px-4 py-3 rounded-lg bg-neutral-800 text-white placeholder-neutral-400 focus:outline-none">
      <textarea name="message" rows="5" placeholder="Tell us about your project..." required class="w-full px-4 py-3 rounded-lg bg-neutral-800 text-white placeholder-neutral-400 focus:outline-none"></textarea>
      <button type="submit" class="w-full py-3 rounded-lg bg-blue-600 hover:bg-blue-700 transition font-semibold">Send Inquiry</button>
    </form>

    <!-- Back button below the form -->
    <button
      onclick="history.back()"
      class="mt-6 w-full py-3 rounded-lg bg-gray-700 hover:bg-gray-600 transition text-white font-semibold"
      type="button"
    >
      Back
    </button>
  </div>

  <script src="inquiries.js"></script>
</body>
</html>
